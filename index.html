<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArabGG - تطبيق تشات عربي</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --bg-dark: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text: #f1f5f9;
      --text-muted: #cbd5e1;
      --border: #475569;
    }

    body {
      font-family: 'Segoe UI', 'Noto Sans Arabic', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== LOGIN PAGE ===== */
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    .login-page.hidden {
      display: none;
    }

    .login-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: slideIn 0.4s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn.danger {
      background: var(--danger);
    }

    .btn.danger:hover {
      background: #dc2626;
    }

    .message-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 4px;
    }

    .message-success {
      color: var(--success);
      font-size: 12px;
      margin-top: 4px;
    }

    /* ===== MAIN APP ===== */
    .app-page {
      display: none;
      height: 100vh;
      grid-template-rows: 60px 1fr;
    }

    .app-page.show {
      display: grid;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      border-radius: 999px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .header-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .header-btn:hover {
      background: var(--primary-dark);
    }

    .header-btn.logout {
      background: var(--danger);
    }

    .header-btn.logout:hover {
      background: #dc2626;
    }

    /* ===== MAIN LAYOUT ===== */
    .main {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      gap: 0;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
    }

    .add-channel-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 20px;
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .channels-list::-webkit-scrollbar {
      width: 6px;
    }

    .channels-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .channel-btn {
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      text-align: right;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .channel-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text);
    }

    .channel-btn.active {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .user-profile {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgba(59, 130, 246, 0.05);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-weight: 600;
      font-size: 14px;
    }

    .user-status {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== CHAT AREA ===== */
    .chat-container {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
    }

    .chat-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-name {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-members {
      font-size: 12px;
      color: var(--text-muted);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .messages-area::-webkit-scrollbar {
      width: 8px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 16px;
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    .message.own {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
      font-size: 14px;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      max-width: 55%;
    }

    .message.own .message-content {
      align-items: flex-end;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      padding: 0 4px;
      font-size: 13px;
    }

    .message-author {
      font-weight: 600;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .message-text {
      background: var(--bg-secondary);
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.own .message-text {
      background: var(--primary);
      color: white;
    }

    .input-area {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      background: var(--bg-secondary);
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      align-items: center;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
    }

    .input-wrapper input {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 0;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .send-btn:hover {
      background: var(--primary-dark);
    }

    /* ===== ACTIVITY SIDEBAR ===== */
    .activity-sidebar {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .activity-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .activity-title {
      font-size: 16px;
      font-weight: 700;
    }

    .online-users {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .online-users::-webkit-scrollbar {
      width: 6px;
    }

    .online-users::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .user-item {
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .user-item:hover {
      background: #475
