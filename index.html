<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>ArabGG - تطبيق تشات عربي أونلاين</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg-dark: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text: #f1f5f9;
      --text-muted: #cbd5e1;
      --border: #475569;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', 'Noto Sans Arabic', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: grid;
      grid-template-rows: 60px 1fr;
      height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      border-radius: 999px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .auth-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .auth-btn:hover {
      background: #2563eb;
    }

    .auth-btn.logout {
      background: var(--danger);
    }

    .auth-btn.logout:hover {
      background: #dc2626;
    }

    /* ===== MAIN LAYOUT ===== */
    .main {
      display: grid;
      grid-template-columns: 260px 1fr 280px;
      gap: 0;
      height: calc(100vh - 60px);
    }

    /* ===== SIDEBAR - القنوات ===== */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .new-channel-btn {
      width: 100%;
      padding: 8px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .new-channel-btn:hover {
      background: #2563eb;
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .channels-list::-webkit-scrollbar {
      width: 6px;
    }

    .channels-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .channel-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      text-align: right;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .channel-item:hover {
      background: var(--bg-tertiary);
      color: var(--text);
    }

    .channel-item.active {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .channel-icon {
      font-size: 16px;
    }

    .user-profile {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgba(59, 130, 246, 0.05);
    }

    .user-profile-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== CHAT AREA ===== */
    .chat-container {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h1 {
      font-size: 18px;
    }

    .chat-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .messages-area::-webkit-scrollbar {
      width: 8px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.own {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      max-width: 60%;
    }

    .message.own .message-content {
      align-items: flex-end;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .message-author {
      font-weight: 600;
      font-size: 14px;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .message-text {
      background: var(--bg-secondary);
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.own .message-text {
      background: var(--primary);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 16px;
    }

    .empty-state-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    .input-area {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      align-items: center;
      transition: border-color 0.3s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
    }

    .input-wrapper input {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 0;
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .send-btn:hover {
      background: #2563eb;
    }

    .send-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }

    /* ===== RIGHT SIDEBAR - النشاط ===== */
    .activity-sidebar {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .activity-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .activity-header h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .online-users {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .online-users::-webkit-scrollbar {
      width: 6px;
    }

    .online-users::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .user-item {
      padding: 12px;
      margin-bottom: 8px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .user-item:hover {
      background: #475569;
    }

    .online-indicator {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    .user-item-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 25px rgba(0,0,0,0.3);
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .btn-submit {
      background: var(--primary);
      color: white;
    }

    .btn-submit:hover {
      background: #2563eb;
    }

    .btn-cancel {
      background: var(--bg-tertiary);
      color: var(--text);
    }

    .btn-cancel:hover {
      background: #475569;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 12px;
      border-radius: 6px;
