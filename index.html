<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11141c">
  <title>ArabGG — نموذج تجريبي</title>
  
  <!-- استدعاء سكريبتات سيرفر جوجل السحابي لجعل كودك أونلاين -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #11141c;
      --panel: #191d28;
      --panel-2: #202533;
      --panel-3: #272d3d;
      --line: rgba(255,255,255,.075);
      --text: #f2f4fa;
      --muted: #a0a8ba;
      --subtle: #727b90;
      --mint: #83e2c6;
      --mint-dark: #183b37;
      --violet: #a99bf7;
      --danger: #ff8b97;
      --radius: 16px;
      font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 66px 1fr;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      background: rgba(25,29,40,.94);
      border-bottom: 1px solid var(--line);
      z-index: 3;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      font-weight: 800;
      letter-spacing: -.4px;
      font-size: 19px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px; height: 34px;
      border-radius: 10px;
      overflow: hidden;
      background: #202838;
      transform: rotate(-4deg);
    }
    .brand-mark svg { width: 100%; height: 100%; transform: rotate(4deg); }
    .brand small { color: var(--muted); font-size: 11px; font-weight: 500; }
    .search {
      position: relative;
      width: min(420px, 42vw);
      margin-inline: auto;
    }
    .search input {
      width: 100%;
      height: 38px;
      padding: 0 38px 0 14px;
      border-radius: 11px;
      border: 1px solid var(--line);
      outline: none;
      color: var(--text);
      background: #121620;
    }
    .search input:focus { border-color: rgba(131,226,198,.55); }
    .search-icon {
      position: absolute;
      right: 13px;
      top: 8px;
      color: var(--subtle);
      pointer-events: none;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .safety-pill, .demo-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      color: #b9f4e4;
      background: rgba(131,226,198,.09);
      border: 1px solid rgba(131,226,198,.15);
      white-space: nowrap;
      font-size: 12px;
    }
    .demo-pill { color: #c7c0ff; background: rgba(169,155,247,.1); border-color: rgba(169,155,247,.17); }
    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 72px 236px minmax(320px,1fr) 218px;
      direction: ltr;
    }
    .layout > * { direction: rtl; }
    .communities {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px 0;
      background: #151923;
      border-left: 1px solid var(--line);
    }
    .community-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-height: calc(100vh - 145px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .community-list::-webkit-scrollbar { display: none; }
    .community-button {
      width: 46px; height: 46px;
      border: 0;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--panel-3);
      cursor: pointer;
      font-size: 20px;
      position: relative;
      transition: .18s ease;
    }
    .community-button:hover { border-radius: 13px; background: #353d50; }
    .community-button.active { border-radius: 13px; background: var(--mint); color: #17211f; }
    .community-button.active::before {
      content: "";
      position: absolute;
      right: -13px;
      width: 4px; height: 25px;
      border-radius: 4px 0 0 4px;
      background: var(--mint);
    }
    .community-button.add { color: var(--mint); background: var(--mint-dark); font-size: 24px; }
    .community-button img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .community-button .avatar-mark, .server-emoji .avatar-mark, .mobile-community-icon .avatar-mark {
      display: grid; width: 100%; height: 100%; place-items: center;
      border-radius: inherit; color: #17211f; font-weight: 800;
    }
    .community-divider { width: 28px; height: 1px; background: var(--line); margin: 2px 0; }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .server-heading {
      padding: 20px 17px 16px;
      border-bottom: 1px solid var(--line);
    }
    .server-title-row { display: flex; align-items: center; gap: 10px; }
    .server-emoji {
      display: grid; place-items: center;
      width: 38px; height: 38px;
      border-radius: 12px;
      background: #2e3546;
      font-size: 19px;
      overflow: hidden;
    }
    .server-emoji img { width: 100%; height: 100%; object-fit: cover; }
    .server-emoji .avatar-mark { font-size: 16px; }
    .server-heading h1 { margin: 0; font-size: 15px; }
    .server-heading p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .private-tag {
      display: inline-flex;
      gap: 5px; align-items: center;
      margin-top: 13px;
      padding: 5px 8px;
      color: #b6c5d9;
      background: rgba(255,255,255,.045);
      border-radius: 7px;
      font-size: 10px;
    }
    .community-policy {
      display: inline-flex;
      gap: 5px; align-items: center;
      margin-top: 6px;
      padding: 5px 8px;
      color: #e3d8bb;
      background: rgba(238,197,142,.075);
      border-radius: 7px;
      font-size: 10px;
    }
    .channel-list { padding: 12px 10px; overflow: auto; }
    .channel-category {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 6px 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .channel-category button {
      border: 0; background: transparent; color: var(--subtle);
      font-size: 17px; cursor: pointer;
    }
    .channel {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      margin: 2px 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: right;
      cursor: pointer;
    }
    .channel:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .channel.active { background: rgba(131,226,198,.11); color: var(--mint); }
    .channel .hash { color: var(--subtle); font-size: 16px; }
    .channel.active .hash { color: var(--mint); }
    .voice-card {
      margin: 5px 4px 7px;
      padding: 11px;
      background: #212838;
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .voice-card-top { display: flex; justify-content: space-between; align-items: center; }
    .voice-card strong { font-size: 12px; }
    .live { color: var(--mint); font-size: 10px; }
    .voice-card p { color: var(--muted); margin: 6px 0 10px; font-size: 11px; }
    .join-voice {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 8px;
      color: #152420;
      background: var(--mint);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .join-voice.joined { color: var(--mint); background: var(--mint-dark); }
    .profile {
      margin-top: auto;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(0,0,0,.15);
      border-top: 1px solid var(--line);
    }
    .avatar {
      flex: 0 0 auto;
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: #17211f; background: #f1c58e;
      font-weight: 800;
    }

    /* --- التنسيقات المضافة لربط الشات وجعله متناسقاً تماماً مع كودك المقطوع --- */
    .main-content {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      background: var(--bg);
    }
    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--line);
    }
    .chat-messages {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message-bubble {
      display: flex;
      gap: 10px;
    }
    .msg-user-title {
      font-weight: 700;
      color: var(--mint);
      font-size: 13px;
    }
    .msg-user-text {
      color: var(--text);
      margin-top: 2px;
    }
    .chat-input-area {
      padding: 15px 20px;
    }
    .chat-input-wrapper {
      display: flex;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 12px;
      align-items: center;
    }
    .chat-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      padding: 4px;
    }
    .chat-input-wrapper button {
      background: var(--mint);
      color: #11141c;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
    }
    .activity-sidebar {
      background: var(--panel);
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="app">
