<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11141c">
  <title>ArabGG — نسخة لايف تعمل فوراً</title>
  
  <!-- استدعاء المكتبات السحابية الرسمية من جوجل لجعل الدردشة أونلاين حقيقية -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #11141c;
      --panel: #191d28;
      --panel-2: #202533;
      --panel-3: #272d3d;
      --line: rgba(255, 255, 255, .075);
      --text: #f2f4fa;
      --muted: #a0a8ba;
      --subtle: #727b90;
      --mint: #83e2c6;
      --mint-dark: #183b37;
      --violet: #a99bf7;
      --radius: 16px;
      font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-size: 14px; overflow: hidden; }
    button, input { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    .app { min-height: 100vh; display: grid; grid-template-rows: 66px 1fr; }

    /* Topbar */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(25, 29, 40, .94); border-bottom: 1px solid var(--line); z-index: 3; backdrop-filter: blur(8px); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: #202838; transform: rotate(-4deg); color: var(--mint); font-weight: 900; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .safety-pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; color: #b9f4e4; background: rgba(131, 226, 198, .09); border: 1px solid rgba(131, 226, 198, .15); font-size: 12px; }
    .login-btn { background: var(--mint); color: #11141c; padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 13px; z-index: 5; }

    /* Layout Structure */
    .layout { min-height: 0; display: grid; grid-template-columns: 72px 236px 1fr 218px; height: calc(100vh - 66px); }

    /* Column 1: Communities */
    .communities { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0; background: #151923; border-left: 1px solid var(--line); }
    .community-button { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; background: var(--panel-3); font-size: 20px; transition: all 0.2s; }
    .community-button.active { background: var(--mint); color: #17211f; }
    .community-divider { width: 28px; height: 1px; background: var(--line); margin: 2px 0; }

    /* Column 2: Sidebar Channels */
    .sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); position: relative; }
    .server-heading { padding: 20px 17px 16px; border-bottom: 1px solid var(--line); }
    .server-heading h1 { margin: 0; font-size: 15px; }
    .channel-list { padding: 12px 10px; overflow-y: auto; flex: 1; }
    .channel-category { color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 8px; }
    .channel { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; color: var(--muted); text-align: right; }
    .channel.active { background: rgba(131, 226, 198, .11); color: var(--mint); }
    .profile { padding: 12px; display: flex; align-items: center; gap: 9px; background: rgba(0, 0, 0, .25); border-top: 1px solid var(--line); width: 100%; position: absolute; bottom: 0; right: 0; }
    .avatar { flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: #17211f; background: #f1c58e; font-weight: 800; }

    /* Column 3: Main Chat Content */
    .main-content { display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); min-height: 0; height: 100%; }
    .chat-header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: rgba(25, 29, 40, 0.4); }
    .chat-header h2 { margin: 0; font-size: 16px; }
    .chat-messages { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; }
    
    .message { display: flex; gap: 12px; animation: fadeIn 0.15s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-3); display: grid; place-items: center; font-weight: bold; flex-shrink: 0; }
    .msg-body { display: flex; flex-direction: column; gap: 4px; }
    .msg-user { font-weight: 700; font-size: 13px; color: var(--mint); }
    .msg-text { color: #e2e8f0; line-height: 1.5; }

    .chat-input-area { padding: 0 24px 24px; background: var(--bg); }
    .chat-input-wrapper { display: flex; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; gap: 10px; }
    .chat-input-wrapper input { flex: 1; height: 44px; background: none; border: none; outline: none; color: var(--text); }
    .send-btn-style { background: var(--mint); color: #11141c; font-weight: 700; padding: 8px 16px; border-radius: 8px; transition: opacity 0.2s; }
    .send-btn-style:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Column 4: Activity Sidebar */
    .activity-sidebar { background: var(--panel); padding: 16px; border-right: 1px solid var(--line); }

    /* --- Auth Modal --- */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 13, 19, 0.85); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .auth-card { background: var(--panel); border: 1px solid var(--line); width: min(400px, 90vw); border-radius: var(--radius); padding: 32px; }
    .auth-card h2 { margin: 0 0 8px; font-size: 22px; text-align: center; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group input { height: 42px; background: #121620; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; color: var(--text); outline: none; }
    .submit-auth { width: 100%; height: 42px; background: var(--mint); color: #11141c; border-radius: 8px; font-weight: 700; margin-top: 10px; }

    /* Responsive */
    @media (max-width: 1024px) { .layout { grid-template-columns: 72px 236px 1fr; } .activity-sidebar { display: none; } }
    @media (max-width: 768px) { .layout { grid-template-columns: 64px 1fr; } .sidebar { display: none; } }
  </style>
</head>
<body>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>ArabGG <small>نسخة مباشرة</small></div>
      </div>
      <div class="top-actions">
        <span class="safety-pill" id="statusPill" style="color: #ffb703; background: rgba(255,183,3,.1);">🟡 جاري الاتصال بالسيرفر السحابي...</span>
        <button class="login-btn" id="openAuthBtn">تسجيل الاسم المستعار</button>
      </div>
    </header>

    <main class="layout">
      <section class="communities">
        <button class="community-button active">G</button>
        <div class="community-divider"></div>
        <button class="community-button" id="addCommunityBtn">+</button>
      </section>

      <section class="sidebar">
        <div class="server-heading">
          <h1 id="serverName">مجتمع الألعاب العربي</h1>
        </div>
        <div class="channel-list">
          <div class="channel-category">قنوات نصية</div>
          <button class="channel active"><span>#</span> العامة</button>
        </div>
        <div class="profile">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div id="usernameDisplay" style="font-weight:700;">زائر (أوفلاين)</div>
            <div style="color:var(--subtle); font-size:10px;">اضغط الزر العلوي للبدء</div>
          </div>
        </div>
      </section>

      <section class="main-content">
        <div class="chat-header">
          <h2># العامة</h2>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <input type="text" id="chatInput" disabled placeholder="اكتب اسمك المستعار من الأعلى أولاً للبدء بالدردشة...">
            <button id="sendMsgBtn" disabled class="send-btn-style">إرسال</button>
          </div>
        </div>
      </section>

      <section class="activity-sidebar">
        <h3 style="font-size:12px; color:var(--muted); margin-bottom: 10px;">حالة السيرفر</h3>
        <p style="font-size:11px; color:#ffb703" id="networkStatus">جاري التوصيل... 🟡</p>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <h2>اختر اسمك المستعار</h2>
      <p style="text-align:center; color:var(--muted); font-size:12px; margin-bottom:20px;">ادخل اسمك لتنشيط واجهة الشات والإرسال فوراً أونلاين</p>
      <form onsubmit="saveUsername(event)">
        <div class="form-group">
          <input type="text" id="customName" required placeholder="مثال: سكوربيون_99" maxlength="15">
        </div>
        <button type="submit" class="submit-auth">دخول إلى الشات</button>
      </form>
    </div>
  </div>

  <script>
    // 🌐 ربط الشات المباشر بسيرفر Firebase المجاني المفتوح والمستقر للدردشة العامة
