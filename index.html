<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>ArabGG - تطبيق تشات عربي أونلاين</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --danger-dark: #dc2626;
      --warning: #f59e0b;
      --bg-dark: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text: #f1f5f9;
      --text-muted: #cbd5e1;
      --border: #475569;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', 'Noto Sans Arabic', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ===== LOGIN PAGE ===== */
    .login-container {
      display: none;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .login-container.show {
      display: flex;
    }

    .login-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: modalSlideIn 0.4s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .login-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .login-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .login-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .login-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: #3d4966;
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background: var(--primary-dark);
    }

    .error-text {
      color: var(--danger);
      font-size: 13px;
      margin-top: 4px;
    }

    .success-text {
      color: var(--success);
      font-size: 13px;
      margin-top: 4px;
    }

    /* ===== MAIN APP ===== */
    .app-container {
      display: none;
      width: 100vw;
      height: 100vh;
      grid-template-rows: 60px 1fr;
    }

    .app-container.show {
      display: grid;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 24px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      border-radius: 999px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .header-buttons {
      display: flex;
      gap: 12px;
    }

    .header-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
      font-size: 13px;
    }

    .header-btn:hover {
      background: var(--primary-dark);
    }

    .header-btn.settings {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .header-btn.settings:hover {
      background: var(--bg-tertiary);
      color: var(--text);
    }

    .header-btn.logout {
      background: var(--danger);
    }

    .header-btn.logout:hover {
      background: var(--danger-dark);
    }

    /* ===== MAIN LAYOUT ===== */
    .main {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      gap: 0;
      height: calc(100vh - 60px);
    }

    /* ===== SIDEBAR - القنوات ===== */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .new-channel-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 20px;
      transition: color 0.3s;
    }

    .new-channel-btn:hover {
      color: var(--primary-dark);
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .channels-list::-webkit-scrollbar {
      width: 6px;
    }

    .channels-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .channels-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .channel-item {
      padding: 12px 16px;
      margin-bottom: 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      text-align: right;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      font-weight: 500;
    }

    .channel-item:hover {
      background: var(--bg-tertiary);
      color: var(--text);
    }

    .channel-item.active {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .channel-icon {
      font-size: 16px;
      min-width: 16px;
    }

    .channel-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .channel-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-count {
      font-size: 11px;
      opacity: 0.7;
    }

    .user-profile {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgba(59, 130, 246, 0.05);
    }

    .user-profile-content {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
      font-size: 16px;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== CHAT AREA ===== */
    .chat-container {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      position: relative;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
    }

    .chat-header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-header-title {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .chat-header-right {
      display: flex;
      gap: 12px;
    }

    .chat-header-btn {
      background: var(--bg-tertiary);
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-header-btn:hover {
      background: #475569;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages-area::-webkit-scrollbar {
      width: 8px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
      align-items: flex-end;
    }

    .message.own {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
      font-size: 14px;
    }

    .message-bubble {
      display: flex;
      flex-direction: column;
      max-width: 55%;
      animation: slideIn 0.3s ease;
    }

    .message.own .message-bubble {
      align-items: flex-end;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .message-author {
      font-weight: 600;
      font-size: 13px;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .message-text {
      background: var(--bg-secondary);
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      font-size: 14px;
    }

    .message.own .message-text {
